# Build BatchDownloader.exe otomatis di server Windows GitHub (gratis).
# Jalankan dari tab Actions → "Build Windows EXE" → Run workflow, lalu unduh artifact-nya.
name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller requests yt-dlp keyring
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name BatchDownloader --icon assets/icon.ico
          --add-data "assets/icon_256.png;assets"
          --collect-all yt_dlp --hidden-import keyring.backends.Windows
          gui.py
      - name: Self-test exe (GUI, penyimpanan key, Drive, link langsung, YouTube)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BatchDownloader.exe -ArgumentList "--selftest","selftest.json" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timeout" }
          Get-Content selftest.json
      - name: Screenshot jendela aplikasi
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath dist\BatchDownloader.exe -PassThru
          Start-Sleep -Seconds 15
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.json
            screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: BatchDownloader-windows
          path: dist/BatchDownloader.exe
