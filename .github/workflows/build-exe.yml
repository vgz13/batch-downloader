# Build BatchDownloader.exe otomatis di server Windows GitHub (gratis).
# Jalankan dari tab Actions → "Build Windows EXE" → Run workflow, lalu unduh artifact-nya.
name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller requests yt-dlp keyring
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name BatchDownloader --icon assets/icon.ico
          --add-data "assets/icon_256.png;assets"
          --collect-all yt_dlp --hidden-import keyring.backends.Windows
          gui.py
      - name: Self-test exe (GUI, penyimpanan key, Drive, link langsung, YouTube)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BatchDownloader.exe -ArgumentList "--selftest","selftest.json" -PassThru
          $done = $p.WaitForExit(600000)
          if (-not $done) { $p.Kill() }
          if (Test-Path selftest.json) { Get-Content selftest.json } else { Write-Host "selftest.json tidak dibuat" }
          if (-not $done) { throw "self-test timeout" }
      - name: Screenshot jendela aplikasi
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath dist\BatchDownloader.exe -PassThru
          Start-Sleep -Seconds 15
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          Stop-Process -Id $p.Id -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.1" }
          & $iscc "/DAppVersion=$ver" installer.iss
          if (-not (Test-Path Output\BatchDownloader-Setup.exe)) { throw "installer tidak terbentuk" }
      - name: Test install, jalankan, uninstall
        shell: pwsh
        run: |
          $p = Start-Process Output\BatchDownloader-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon","/LOG=setup.log" -PassThru -Wait
          Write-Host "setup exit: $($p.ExitCode)"
          $app = "$env:LOCALAPPDATA\Programs\Batch Downloader"
          if (-not (Test-Path "$app\BatchDownloader.exe")) { Get-Content setup.log -Tail 30; throw "exe tidak terpasang" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Batch Downloader.lnk"
          $desk = Test-Path "$env:USERPROFILE\Desktop\Batch Downloader.lnk"
          Write-Host "start menu shortcut: $($lnk.Count -gt 0) | desktop shortcut: $desk"
          $t = Start-Process "$app\BatchDownloader.exe" -ArgumentList "--selftest","installed-selftest.json" -PassThru
          if (-not $t.WaitForExit(300000)) { $t.Kill(); throw "aplikasi terpasang macet" }
          Get-Content installed-selftest.json | Select-String '"gui"|"keystore"|"finished"'
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          Write-Host "setelah uninstall, exe masih ada: $(Test-Path "$app\BatchDownloader.exe")"
          if (Test-Path "$app\BatchDownloader.exe") { throw "uninstall gagal" }
      - uses: actions/upload-artifact@v4
        with:
          name: BatchDownloader-Setup
          path: Output/BatchDownloader-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.json
            installed-selftest.json
            setup.log
            screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: BatchDownloader-windows
          path: dist/BatchDownloader.exe
